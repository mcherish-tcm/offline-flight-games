<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1622" />
    <title>หาระเบิด · เกมบนเครื่องบิน</title>
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml" />
    <script>
      try {
        if (localStorage.getItem('ffg:theme') === '"light"') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../shared/app.js" data-root="../../" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body class="game">
    <header class="bar">
      <a class="bar__back" href="../../" data-icon="back">หน้าแรก</a>
      <h1 class="bar__title">หาระเบิด</h1>
      <div class="bar__actions">
        <button type="button" class="icon-btn" id="new" data-icon="restart" aria-label="เกมใหม่ / เปลี่ยนขนาด"></button>
      </div>
    </header>
    <main class="stage">
      <div class="ms-top">
        <span class="ms-count" data-icon="flag"><span class="num" id="left">0</span></span>
        <span class="ms-level" id="level"></span>
        <span class="ms-time num" id="time">0:00</span>
      </div>
      <div class="board-wrap">
        <div class="ms-board" id="board" role="grid" aria-label="กระดานหาระเบิด"></div>
      </div>
      <div class="seg ms-mode" role="radiogroup" aria-label="โหมดการแตะ">
        <button type="button" role="radio" id="mode-open" aria-checked="true">แตะเพื่อเปิด</button>
        <button type="button" role="radio" id="mode-flag" aria-checked="false" data-icon="flag">โหมดปักธง</button>
      </div>
      <p class="ms-hint">กดค้างที่ช่องเพื่อปักธงได้ทุกโหมด · แตะเลขที่ปักธงครบแล้วเพื่อเปิดรอบ ๆ</p>
    </main>
  </body>
</html>
