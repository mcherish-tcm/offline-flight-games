<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1622" />
    <title>ซูโดกุ · เกมบนเครื่องบิน</title>
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml" />
    <script>
      try {
        if (localStorage.getItem('ffg:theme') === '"light"') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../shared/games.js" defer></script>
    <script src="../../shared/app.js" data-root="../../" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body class="game">
    <header class="bar">
      <a class="bar__back" href="../../" data-icon="back">หน้าแรก</a>
      <h1 class="bar__title">ซูโดกุ</h1>
      <div class="bar__actions">
        <button type="button" class="icon-btn" data-howto="sudoku" data-icon="info" aria-label="วิธีเล่น"></button>
        <button type="button" class="icon-btn" id="undo" data-icon="undo" aria-label="ย้อน" disabled></button>
        <button type="button" class="icon-btn" id="new" data-icon="restart" aria-label="เกมใหม่"></button>
      </div>
    </header>
    <main class="stage">
      <div class="sd-top">
        <span class="sd-level" id="level">—</span>
        <span class="sd-time num" id="time" aria-label="เวลา">0:00</span>
      </div>
      <div class="board-wrap">
        <div class="sd-board" id="board" role="grid" aria-label="ตารางซูโดกุ"></div>
      </div>
      <div class="sd-tools">
        <button type="button" class="btn" id="notes" data-icon="pencil" aria-pressed="false">โน้ต</button>
        <button type="button" class="btn" id="erase" data-icon="erase">ลบ</button>
        <button type="button" class="btn" id="check" data-icon="check" aria-pressed="true">เช็คผิด</button>
      </div>
      <div class="sd-pad" id="pad" aria-label="แป้นตัวเลข"></div>
    </main>
  </body>
</html>
