<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1622" />
    <title>โซลิแทร์ · เกมบนเครื่องบิน</title>
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml" />
    <script>
      try {
        if (localStorage.getItem('ffg:theme') === '"light"') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../shared/games.js" defer></script>
    <script src="../../shared/app.js" data-root="../../" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body class="game">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <symbol id="suit-0" viewBox="0 0 24 24"><path d="M12 2C9 6.5 4 9.6 4 13.6c0 2.6 2 4.4 4.3 4.4 1.3 0 2.4-.5 3.1-1.4-.3 1.9-1.1 3.4-2.4 4.6h6c-1.3-1.2-2.1-2.7-2.4-4.6.7.9 1.8 1.4 3.1 1.4 2.3 0 4.3-1.8 4.3-4.4C20 9.6 15 6.5 12 2z" fill="currentColor"/></symbol>
      <symbol id="suit-1" viewBox="0 0 24 24"><path d="M12 21s-8.5-5.3-8.5-11.4C3.5 6.5 5.8 4.3 8.6 4.3c1.5 0 2.7.7 3.4 1.8.7-1.1 1.9-1.8 3.4-1.8 2.8 0 5.1 2.2 5.1 5.3C20.5 15.7 12 21 12 21z" fill="currentColor"/></symbol>
      <symbol id="suit-2" viewBox="0 0 24 24"><path d="M12 2l7.2 10L12 22 4.8 12z" fill="currentColor"/></symbol>
      <symbol id="suit-3" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="12" cy="7.2" r="4.3"/><circle cx="6.9" cy="13.4" r="4.3"/><circle cx="17.1" cy="13.4" r="4.3"/><path d="M11 11.5h2c0 4.3.9 7 3 9.5H8c2.1-2.5 3-5.2 3-9.5z"/></g></symbol>
    </svg>
    <header class="bar">
      <a class="bar__back" href="../../" data-icon="back">หน้าแรก</a>
      <h1 class="bar__title">โซลิแทร์</h1>
      <div class="bar__actions">
        <button type="button" class="icon-btn" data-howto="solitaire" data-icon="info" aria-label="วิธีเล่น"></button>
        <button type="button" class="icon-btn" id="undo" data-icon="undo" aria-label="ย้อน" disabled></button>
        <button type="button" class="icon-btn" id="settings" data-settings data-icon="gear" aria-label="ตั้งค่า · แบบการจั่ว"></button>
        <button type="button" class="icon-btn" id="new" data-icon="restart" aria-label="แจกใหม่"></button>
      </div>
    </header>
    <main class="stage">
      <div class="sol-top">
        <span>ย้าย <b class="num" id="moves">0</b></span>
        <span id="mode"></span>
        <span class="num" id="time">0:00</span>
      </div>
      <div class="sol-board" id="board" aria-label="โต๊ะไพ่ แตะไพ่เพื่อย้ายไปที่ที่ลงได้ หรือลากวาง"></div>
      <button type="button" class="btn btn--primary sol-auto" id="auto" data-icon="wand" hidden>เก็บไพ่ขึ้นกองอัตโนมัติ</button>
    </main>
  </body>
</html>
