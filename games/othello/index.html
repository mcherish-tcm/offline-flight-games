<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1622" />
    <title>โอเทลโล · เกมบนเครื่องบิน</title>
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml" />
    <script>
      try {
        if (localStorage.getItem('ffg:theme') === '"light"') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="../../shared/duo.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../shared/games.js" defer></script>
    <script src="../../shared/app.js" data-root="../../" defer></script>
    <script src="../../shared/duo.js" defer></script>
    <script src="engine.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body class="game">
    <header class="bar">
      <a class="bar__back" href="../../" data-icon="back">หน้าแรก</a>
      <h1 class="bar__title">โอเทลโล</h1>
      <div class="bar__actions">
        <button type="button" class="icon-btn" data-howto="othello" data-icon="info" aria-label="วิธีเล่น"></button>
        <button type="button" class="icon-btn" id="settings" data-icon="sliders" aria-label="ตั้งค่า · เล่นกับคอม"></button>
        <button type="button" class="icon-btn" id="restart" data-icon="restart" aria-label="เริ่มตานี้ใหม่"></button>
      </div>
    </header>
    <main class="stage duo" id="stage">
      <div class="duo-board-wrap" id="wrap">
        <div class="ot-board" id="board" role="grid" aria-label="กระดานโอเทลโล 8 คูณ 8"></div>
      </div>
      <p class="ot-hint" id="hint" aria-live="polite"></p>
    </main>
  </body>
</html>
