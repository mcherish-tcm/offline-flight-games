<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1622" />
    <title>สไปเดอร์ · เกมบนเครื่องบิน</title>
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml" />
    <script>
      try {
        if (localStorage.getItem('ffg:theme') === '"light"') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="../../shared/cards.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../shared/games.js" defer></script>
    <script src="../../shared/app.js" data-root="../../" defer></script>
    <script src="../../shared/cards.js" defer></script>
    <script src="engine.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body class="game">
    <header class="bar">
      <a class="bar__back" href="../../" data-icon="back">หน้าแรก</a>
      <h1 class="bar__title">สไปเดอร์</h1>
      <div class="bar__actions">
        <button type="button" class="icon-btn" data-howto="spider" data-icon="info" aria-label="วิธีเล่น"></button>
        <button type="button" class="icon-btn" id="undo" data-icon="undo" aria-label="ย้อน" disabled></button>
        <button type="button" class="icon-btn" id="settings" data-settings data-icon="gear" aria-label="ตั้งค่า · จำนวนดอก"></button>
        <button type="button" class="icon-btn" id="new" data-icon="restart" aria-label="แจกใหม่"></button>
      </div>
    </header>
    <main class="stage cards">
      <div class="cards-top">
        <span>ย้าย <b class="num" id="moves">0</b></span>
        <button type="button" class="sp-mode" id="mode" aria-label="จำนวนดอก — แตะเพื่อเปลี่ยน"></button>
        <span class="num" id="time">0:00</span>
      </div>
      <div class="cards-board" id="board" aria-label="โต๊ะไพ่ แตะไพ่เพื่อย้ายไปที่ที่ลงได้ หรือลากวาง"></div>
    </main>
  </body>
</html>
